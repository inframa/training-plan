<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>反馈管理后台 · 健身容量记录</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f6fa; color: #1f2329; padding-bottom: 40px; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 16px; }

  /* 连接区 */
  .connect { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); margin-bottom: 16px; }
  .connect-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
  .connect-row:last-child { margin-bottom: 0; }
  .connect label { font-size: 13px; color: #646a73; min-width: 90px; }
  .connect input { flex: 1; padding: 8px 12px; border: 1px solid #e5e6eb; border-radius: 8px; font-size: 13px; }
  .connect input:focus { outline: none; border-color: #2e6be6; }
  .btn { padding: 8px 18px; border-radius: 8px; border: none; font-size: 13px; cursor: pointer; background: #2e6be6; color: #fff; transition: background .15s; }
  .btn:hover { background: #1e5ad6; }
  .btn.gray { background: #f2f3f7; color: #4a5058; }
  .btn.gray:hover { background: #e8e9ef; }
  .btn.danger { background: #e5484d; }
  .btn.danger:hover { background: #d03d42; }
  .btn.sm { padding: 5px 12px; font-size: 12px; }
  .conn-status { font-size: 12px; margin-left: auto; }
  .conn-status.ok { color: #2ba471; }
  .conn-status.err { color: #e5484d; }

  /* 统计面板 */
  .stats { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); margin-bottom: 16px; }
  .stats-grid { display: flex; gap: 12px; margin-bottom: 14px; }
  .stat { flex: 1; text-align: center; background: #f7f9fc; border-radius: 10px; padding: 12px 8px; }
  .stat-num { font-size: 28px; font-weight: 700; color: #2e6be6; }
  .stat-num.orange { color: #e6912e; }
  .stat-num.green { color: #2ba471; }
  .stat-label { font-size: 12px; color: #9aa3ae; margin-top: 2px; }
  .stats-types { display: flex; flex-wrap: wrap; gap: 10px 18px; font-size: 13px; color: #4a5058; }
  .type-chip { font-size: 12px; padding: 3px 10px; border-radius: 999px; }
  .type-chip.bug { background: #fdeced; color: #e5484d; }
  .type-chip.feature { background: #e6f0ff; color: #2e6be6; }
  .type-chip.experience { background: #fef0e1; color: #e6912e; }
  .type-chip.other { background: #f2f3f7; color: #8a9099; }

  /* 搜索 + 筛选 */
  .toolbar { display: flex; gap: 10px; margin-bottom: 12px; align-items: stretch; }
  .search-box { flex: 1; position: relative; }
  .search-box input { width: 100%; height: 38px; padding: 0 32px 0 14px; border: 1px solid #e5e6eb; border-radius: 8px; font-size: 13px; background: #fff; }
  .search-box input:focus { outline: none; border-color: #2e6be6; }
  .search-box .clear { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: #9aa3ae; cursor: pointer; font-size: 14px; display: none; }
  .search-box.has-val .clear { display: block; }
  .type-filters { display: flex; gap: 6px; flex-wrap: wrap; background: #fff; border-radius: 10px; padding: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
  .type-filters span { padding: 5px 14px; border-radius: 7px; font-size: 12px; cursor: pointer; color: #4a5058; white-space: nowrap; }
  .type-filters span.active { background: #2e6be6; color: #fff; }

  /* Tabs */
  .tabs { display: flex; gap: 4px; background: #fff; border-radius: 10px; padding: 4px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
  .tab { flex: 1; text-align: center; padding: 10px 0; border-radius: 8px; font-size: 14px; cursor: pointer; color: #4a5058; }
  .tab.active { background: #2e6be6; color: #fff; font-weight: 500; }
  .tab .cnt { opacity: 0.7; font-size: 12px; margin-left: 4px; }

  /* 列表 */
  .empty { text-align: center; padding: 60px 0; color: #9aa3ae; font-size: 14px; }
  .item { background: #fff; border-radius: 12px; padding: 18px 20px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
  .item-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .type-tag { font-size: 12px; padding: 3px 10px; border-radius: 999px; }
  .type-tag.bug { background: #fdeced; color: #e5484d; }
  .type-tag.feature { background: #e6f0ff; color: #2e6be6; }
  .type-tag.experience { background: #fef0e1; color: #e6912e; }
  .type-tag.other { background: #f2f3f7; color: #8a9099; }
  .status-badge { font-size: 12px; padding: 3px 12px; border-radius: 999px; }
  .status-badge.pending { background: #fef0e1; color: #e6912e; }
  .status-badge.resolved { background: #e5f5eb; color: #2ba471; }
  .expand-btn { margin-left: auto; font-size: 12px; color: #9aa3ae; cursor: pointer; }
  .expand-btn:hover { color: #2e6be6; }
  .item-content { font-size: 14px; line-height: 1.6; background: #f7f9fc; border-radius: 8px; padding: 12px 14px; margin: 10px 0; cursor: pointer; word-break: break-all; }
  .item-content:hover { background: #eef2fb; }
  .item-meta { font-size: 12px; color: #9aa3ae; display: flex; gap: 16px; margin-bottom: 4px; }

  /* 详情 */
  .detail { border-top: 1px dashed #e5e6eb; margin-top: 10px; padding-top: 14px; }
  .contact-row { font-size: 12px; color: #646a73; margin-bottom: 10px; }
  .contact-row a { color: #2e6be6; margin-left: 8px; cursor: pointer; text-decoration: none; }

  /* 回复展示 */
  .reply-show { background: #eaf0fe; border-left: 4px solid #2e6be6; border-radius: 0 8px 8px 0; padding: 10px 14px; margin: 10px 0; }
  .reply-show-label { font-size: 12px; color: #2e6be6; font-weight: 600; margin-bottom: 4px; }
  .reply-show-text { font-size: 13px; line-height: 1.6; color: #1f2329; }
  .reply-show-time { font-size: 11px; color: #9aa3ae; margin-top: 4px; }

  /* 回复输入 */
  .reply-input { width: 100%; min-height: 70px; padding: 10px 12px; border: 1px solid #e5e6eb; border-radius: 8px; font-size: 13px; font-family: inherit; resize: vertical; box-sizing: border-box; margin-top: 10px; }
  .reply-input:focus { outline: none; border-color: #2e6be6; }

  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .loading { text-align: center; padding: 40px; color: #9aa3ae; }

  .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 13px; z-index: 9999; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }

  .footer-tip { text-align: center; font-size: 12px; color: #9aa3ae; margin-top: 30px; }

  @media (max-width: 640px) {
    .toolbar { flex-direction: column; }
    .type-filters { justify-content: flex-start; overflow-x: auto; flex-wrap: nowrap; }
    .stats-grid { gap: 8px; }
    .stat-num { font-size: 22px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>📋 反馈管理后台</h1>

  <!-- 连接 -->
  <div class="connect" id="connectBox">
    <div class="connect-row">
      <label>环境 ID</label>
      <input id="envIdInput" placeholder="cloud1-xxxxxxxxxx" />
    </div>
    <div class="connect-row">
      <label>管理密钥</label>
      <input id="adminKeyInput" type="password" placeholder="feedback 云函数 ADMIN_KEY" />
    </div>
    <div class="connect-row">
      <button class="btn" id="initBtn">连接云开发</button>
      <span class="conn-status" id="connStatus">未连接</span>
    </div>
    <div style="font-size:12px;color:#9aa3ae;margin-top:8px">
      首次使用需在云开发控制台开启「匿名登录」和配置「Web 安全域名」
    </div>
  </div>

  <!-- 统计面板 -->
  <div class="stats" id="statsBox" style="display:none">
    <div class="stats-grid">
      <div class="stat"><div class="stat-num" id="stTotal">-</div><div class="stat-label">全部反馈</div></div>
      <div class="stat"><div class="stat-num orange" id="stPending">-</div><div class="stat-label">待处理</div></div>
      <div class="stat"><div class="stat-num green" id="stResolved">-</div><div class="stat-label">已处理</div></div>
    </div>
    <div class="stats-types" id="stTypes"></div>
  </div>

  <!-- 筛选工具栏 -->
  <div class="toolbar" id="toolbar" style="display:none">
    <div class="search-box" id="searchBox">
      <input id="searchInput" placeholder="搜索反馈内容…" />
      <span class="clear" id="clearSearch" title="清除">✕</span>
    </div>
  </div>
  <div class="type-filters" id="typeFilters" style="display:none">
    <span data-type="" class="active">全部类型</span>
    <span data-type="bug">Bug</span>
    <span data-type="feature">建议</span>
    <span data-type="experience">体验</span>
    <span data-type="other">其他</span>
  </div>

  <!-- Tabs -->
  <div class="tabs" id="tabs" style="display:none">
    <div class="tab active" data-tab="all">全部 <span class="cnt" id="cntAll"></span></div>
    <div class="tab" data-tab="pending">待处理 <span class="cnt" id="cntPending"></span></div>
    <div class="tab" data-tab="resolved">已处理 <span class="cnt" id="cntResolved"></span></div>
  </div>

  <!-- 列表 -->
  <div id="listArea"></div>

  <div class="footer-tip">💡 点击反馈内容可复制 · 管理密钥存储在浏览器 localStorage</div>
</div>

<div class="toast" id="toast"></div>

<script src="https://static.cloudbase.net/cloudbase-js-sdk/latest/cloudbase.full.js"></script>
<script>
(function() {
  let app = null, connected = false;
  let currentTab = 'all', currentType = '', currentKeyword = '';
  let allList = [];
  const savedEnv = localStorage.getItem('fb_envId') || '';
  const savedKey = localStorage.getItem('fb_adminKey') || '';
  document.getElementById('envIdInput').value = savedEnv;
  document.getElementById('adminKeyInput').value = savedKey;

  function toast(msg, ms) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove('show'), ms || 1800);
  }
  function showConnected(ok, msg) {
    const s = document.getElementById('connStatus');
    s.textContent = msg;
    s.className = 'conn-status ' + (ok ? 'ok' : 'err');
    if (ok) {
      document.getElementById('connectBox').style.opacity = '0.5';
      document.getElementById('envIdInput').disabled = true;
      document.getElementById('adminKeyInput').disabled = true;
      document.getElementById('initBtn').disabled = true;
      document.getElementById('initBtn').textContent = '已连接';
      document.getElementById('statsBox').style.display = '';
      document.getElementById('toolbar').style.display = '';
      document.getElementById('typeFilters').style.display = '';
      document.getElementById('tabs').style.display = '';
    }
  }
  async function callFB(action, payload) {
    const key = document.getElementById('adminKeyInput').value.trim();
    const r = await app.callFunction({ name: 'feedback', data: Object.assign({ action, adminKey: key }, payload || {}) });
    const res = r.result;
    if (!res || res.code !== 0) throw new Error((res && res.message) || '未知错误');
    return res.data;
  }

  // === 初始化 ===
  document.getElementById('initBtn').addEventListener('click', async () => {
    const envId = document.getElementById('envIdInput').value.trim();
    const adminKey = document.getElementById('adminKeyInput').value.trim();
    if (!envId) { toast('请输入环境 ID'); return; }
    if (!adminKey) { toast('请输入管理密钥'); return; }
    localStorage.setItem('fb_envId', envId);
    localStorage.setItem('fb_adminKey', adminKey);
    showConnected(false, '连接中…');
    try {
      app = cloudbase.init({ env: envId });
      await app.auth().signInAnonymously();
      connected = true;
      showConnected(true, '✅ 已连接');
      await refreshStats();
      await refresh();
    } catch (e) {
      showConnected(false, '❌ ' + (e.message || '连接失败'));
      toast('连接失败，请检查环境 ID 和匿名登录配置');
    }
  });

  async function refreshStats() {
    if (!connected) return;
    try {
      const s = await callFB('stats');
      document.getElementById('stTotal').textContent = s.total;
      document.getElementById('stPending').textContent = s.pending;
      document.getElementById('stResolved').textContent = s.resolved;
      const typesEl = document.getElementById('stTypes');
      const tl = { bug: 'Bug', feature: '建议', experience: '体验', other: '其他' };
      typesEl.innerHTML = Object.keys(s.byType).map(k =>
        `<span><span class="type-chip ${k}">${tl[k]}</span> ${s.byType[k]}</span>`
      ).join('');
      document.getElementById('cntAll').textContent = s.total ? '('+s.total+')' : '';
      document.getElementById('cntPending').textContent = s.pending ? '('+s.pending+')' : '';
      document.getElementById('cntResolved').textContent = s.resolved ? '('+s.resolved+')' : '';
    } catch (e) { console.error('stats err', e); }
  }

  async function refresh() {
    if (!connected) return;
    document.getElementById('listArea').innerHTML = '<div class="loading">加载中…</div>';
    try {
      const payload = {};
      if (currentTab !== 'all') payload.status = currentTab;
      if (currentType) payload.type = currentType;
      if (currentKeyword) payload.keyword = currentKeyword;
      allList = await callFB('listAll', payload);
      renderList();
    } catch (e) {
      document.getElementById('listArea').innerHTML = '<div class="empty">加载失败：' + e.message + '</div>';
    }
  }

  // === 渲染 ===
  const typeLabel = { bug: 'Bug', feature: '建议', experience: '体验', other: '其他' };
  function fmtTime(ts) {
    if (!ts) return '';
    const d = new Date(ts), p = n => (n<10?'0'+n:n);
    return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function renderList() {
    const area = document.getElementById('listArea');
    if (!allList.length) { area.innerHTML = '<div class="empty">当前筛选条件下暂无反馈</div>'; return; }
    area.innerHTML = allList.map(item => `
      <div class="item" id="item-${item._id}">
        <div class="item-head">
          <span class="type-tag ${item.type}">${typeLabel[item.type] || '其他'}</span>
          <span class="status-badge ${item.status}">${item.status === 'resolved' ? '已处理' : '待处理'}</span>
          <span class="expand-btn" data-id="${item._id}">展开 ▼</span>
        </div>
        <div class="item-content" data-content="${esc(item.content)}">${esc(item.content)}</div>
        <div class="item-meta">
          <span>👤 ${item.openidMask}</span>
          <span>🕐 ${fmtTime(item.createdAt)}</span>
        </div>
        <div class="detail" style="display:none"></div>
      </div>
    `).join('');

    area.querySelectorAll('.expand-btn').forEach(b => b.addEventListener('click', () => toggleExpand(b.dataset.id)));
    area.querySelectorAll('.item-content').forEach(el => el.addEventListener('click', () => {
      navigator.clipboard.writeText(el.dataset.content).then(() => toast('内容已复制'));
    }));
  }

  function toggleExpand(id) {
    const item = allList.find(x => x._id === id);
    if (!item) return;
    const box = document.querySelector('#item-' + id + ' .detail');
    const btn = document.querySelector('#item-' + id + ' .expand-btn');
    if (box.style.display === 'none') {
      box.style.display = 'block';
      btn.textContent = '收起 ▲';
      let html = '';
      if (item.contact) html += `<div class="contact-row">📞 联系方式：${esc(item.contact)} <a data-clip="${esc(item.contact)}">复制</a></div>`;
      if (item.resolvedAt && !item.adminReply) html += `<div style="font-size:12px;color:#9aa3ae">标记已处理于 ${fmtTime(item.resolvedAt)}</div>`;
      if (item.adminReply) {
        html += `<div class="reply-show">
          <div class="reply-show-label">👨‍💼 管理员回复</div>
          <div class="reply-show-text">${esc(item.adminReply)}</div>
          ${item.repliedAt ? `<div class="reply-show-time">回复于 ${fmtTime(item.repliedAt)}</div>` : ''}
        </div>`;
      }
      html += `<textarea class="reply-input" placeholder="输入回复（回复后自动标记已处理）" data-id="${item._id}">${item.adminReply || ''}</textarea>
        <div class="actions">
          <button class="btn sm" data-reply="${item._id}">发送回复</button>
          <button class="btn gray sm" data-toggle="${item._id}" data-status="${item.status}">${item.status === 'resolved' ? '标记待处理' : '标记已处理'}</button>
          <button class="btn danger sm" data-del="${item._id}">删除</button>
        </div>`;
      box.innerHTML = html;
      box.querySelectorAll('[data-clip]').forEach(el => el.addEventListener('click', () => {
        navigator.clipboard.writeText(el.dataset.clip).then(() => toast('已复制'));
      }));
      box.querySelectorAll('[data-reply]').forEach(el => el.addEventListener('click', () => doReply(el.dataset.reply)));
      box.querySelectorAll('[data-toggle]').forEach(el => el.addEventListener('click', () => doToggle(el.dataset.toggle, el.dataset.status)));
      box.querySelectorAll('[data-del]').forEach(el => el.addEventListener('click', () => doDelete(el.dataset.del)));
    } else {
      box.style.display = 'none';
      btn.textContent = '展开 ▼';
    }
  }

  async function doReply(id) {
    const ta = document.querySelector('#item-' + id + ' .reply-input');
    const text = (ta.value || '').trim();
    if (!text) { toast('回复内容不能为空'); return; }
    try {
      await callFB('reply', { id, reply: text });
      toast('回复已发送');
      await refreshStats();
      await refresh();
    } catch (e) { toast('回复失败：' + e.message); }
  }
  async function doToggle(id, status) {
    const next = status === 'resolved' ? 'pending' : 'resolved';
    try {
      await callFB('markResolved', { id, status: next });
      toast('已更新');
      await refreshStats();
      await refresh();
    } catch (e) { toast('操作失败：' + e.message); }
  }
  async function doDelete(id) {
    if (!confirm('确定删除这条反馈吗？不可恢复。')) return;
    try {
      await callFB('delete', { id });
      toast('已删除');
      await refreshStats();
      await refresh();
    } catch (e) { toast('删除失败：' + e.message); }
  }

  // === Tabs ===
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    currentTab = t.dataset.tab;
    refresh();
  }));

  // === Type filters ===
  document.querySelectorAll('#typeFilters span').forEach(s => s.addEventListener('click', () => {
    document.querySelectorAll('#typeFilters span').forEach(x => x.classList.remove('active'));
    s.classList.add('active');
    currentType = s.dataset.type;
    refresh();
  }));

  // === Search ===
  const si = document.getElementById('searchInput');
  const sb = document.getElementById('searchBox');
  const cs = document.getElementById('clearSearch');
  si.addEventListener('input', () => {
    currentKeyword = si.value.trim();
    sb.classList.toggle('has-val', !!currentKeyword);
  });
  let searchTimer;
  si.addEventListener('keydown', e => {
    if (e.key === 'Enter') { clearTimeout(searchTimer); refresh(); }
  });
  // 300ms 自动搜索
  si.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(refresh, 300);
  });
  cs.addEventListener('click', () => { si.value = ''; currentKeyword = ''; sb.classList.remove('has-val'); refresh(); });
})();
</script>
</body>
</html>
